<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Algebra Card Game · ANUPAM | MATHSPHERE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0516; --bg2:#140a2e; --surface:#170d33; --surface-2:#211347; --line:#3d2b73; --text:#f7f0ff; --muted:#bcaee3;
  --pink:#ff3d9a; --orange:#ff9a3c; --cyan:#2de2e6; --violet:#7a3dff; --gold:#ffe14d;
  --brand:#ff3d9a; --brand-ink:#1a0633; --soft:#2c1658; --focus:#2de2e6;
  --good:#35f0a0; --good-bg:#0c3a2e; --bad:#ff5470; --bad-bg:#401327; --warn-bg:#3d2d0c; --warn:#ffd166;
  --pc1:#ff5470; --pc2:#2de2e6; --pc3:#35f0a0; --pc4:#ffe14d; --pc5:#b388ff; --pc6:#ff9a3c;
  --font-d:'Anton','Impact',system-ui,sans-serif;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --glow:0 0 0 1px rgba(255,61,154,.35),0 8px 30px -8px rgba(255,61,154,.45);
  --shadow:0 2px 0 rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:var(--font-ui);font-size:16px;line-height:1.5;min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(255,61,154,.22),transparent 60%),
    radial-gradient(800px 500px at -10% 10%,rgba(122,61,255,.28),transparent 60%),
    radial-gradient(700px 400px at 50% 110%,rgba(255,154,60,.16),transparent 60%),
    var(--bg);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.wrap{max-width:1380px;margin:0 auto;padding:14px 16px 28px}
.help{color:var(--muted);font-size:14px}
.fine{color:var(--muted);font-size:13px}
.disp{font-family:var(--font-d);letter-spacing:.02em;text-transform:uppercase;font-weight:400}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:6px 0 14px}
.lock{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.logo{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(255,61,154,.7))}
.lock .nm{font-family:var(--font-d);font-size:24px;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.lock .nm b{font-weight:400;background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.lock .nm i{font-style:normal;color:var(--cyan);margin:0 6px}
.lock small{display:block;font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.soc{display:flex;gap:8px;align-items:center}
.soc a{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);transition:transform .15s,box-shadow .15s,border-color .15s}
.soc a:hover{transform:translateY(-2px);border-color:var(--pink);box-shadow:var(--glow)}
.soc svg{width:20px;height:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.snd{display:flex;gap:8px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.snd button{padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.snd button[aria-pressed="true"]{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;color:var(--brand-ink)}
.snd input[type=range]{width:84px;accent-color:var(--pink)}
.btn{padding:9px 16px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-weight:600;box-shadow:var(--shadow);transition:transform .12s,border-color .12s,filter .12s}
.btn:hover:not(:disabled){border-color:var(--pink);transform:translateY(-1px)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.primary{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;color:var(--brand-ink);font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.good{background:linear-gradient(90deg,#35f0a0,#2de2e6);border-color:transparent;color:#052018;font-weight:700}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.big{padding:14px 34px;font-size:18px;font-family:var(--font-d);letter-spacing:.08em;text-transform:uppercase;font-weight:400}
.btn.quiet{box-shadow:none;background:transparent}
.btn.sm{padding:6px 12px;font-size:13px}

/* card faces */
.face{display:block;width:100%;aspect-ratio:1;background-size:700% 700%;background-repeat:no-repeat}
.cface{display:block;container-type:inline-size;position:relative;width:100%;aspect-ratio:1;font-family:var(--font-ui)}
.cf-in{position:absolute;inset:3.2cqw;border:.5cqw solid #14202b;border-radius:6cqw;background:var(--mbg);overflow:hidden;color:#14202b}
.cf-t{position:absolute;left:5cqw;top:4cqw;width:68cqw;font-size:8.5cqw;line-height:1.15}
.cf-v{position:absolute;left:76cqw;top:0;bottom:0;border-left:.5cqw solid #14202b}
.cf-h{position:absolute;left:0;right:0;top:77cqw;border-top:.5cqw solid #14202b}
.cf-id{position:absolute;left:5cqw;bottom:3.5cqw;font-family:var(--font-mono);font-size:5.5cqw}
.cf-p{position:absolute;right:0;bottom:0;width:21cqw;height:17cqw;background:#14202b;color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-size:12cqw}
.cf-pip{position:absolute;width:6.5cqw;height:6.5cqw;border-radius:50%;border:.6cqw solid #14202b;background:var(--mbg);transform:translate(-50%,-50%)}
.cf-pip.f{background:#14202b}

/* hero */
.hero{position:relative;height:clamp(360px,44vw,540px);border-radius:20px;overflow:hidden;border:1px solid var(--pink);box-shadow:0 0 0 1px rgba(255,61,154,.3),0 18px 60px -14px rgba(255,61,154,.55);margin-bottom:18px;isolation:isolate;background:linear-gradient(180deg,#0d0326 0%,#3a0f7a 38%,#c2268a 68%,#ff7a3c 100%);--mx:0;--my:0}
.hero>*,.h-par1>*{position:absolute}
.h-stars{inset:0 0 45% 0;background-image:radial-gradient(1.5px 1.5px at 8% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 48%,#fff,transparent),radial-gradient(1px 1px at 35% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 30%,#fff,transparent),radial-gradient(1px 1px at 66% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 40%,#fff,transparent),radial-gradient(1px 1px at 90% 18%,#fff,transparent),radial-gradient(1px 1px at 14% 70%,#fff,transparent),radial-gradient(1px 1px at 60% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 66%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.h-par1{inset:0;transform:translate(calc(var(--mx)*-10px),calc(var(--my)*-6px));transition:transform .25s ease-out}
.h-par2{inset:0;transform:translate(calc(var(--mx)*18px),calc(var(--my)*10px));transition:transform .25s ease-out;perspective:900px}
.h-sun{left:50%;bottom:30%;width:clamp(220px,34vw,420px);aspect-ratio:1;margin-left:calc(clamp(220px,34vw,420px)/-2);border-radius:50%;background:linear-gradient(180deg,#fff27a 0%,#ffb13c 40%,#ff3d9a 85%);
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 56%,transparent 56% 58%,#000 58% 66%,transparent 66% 69%,#000 69% 76%,transparent 76% 80%,#000 80% 86%,transparent 86% 91%,#000 91%);mask-image:repeating-linear-gradient(180deg,#000 0 56%,transparent 56% 58%,#000 58% 66%,transparent 66% 69%,#000 69% 76%,transparent 76% 80%,#000 80% 86%,transparent 86% 91%,#000 91%);
  filter:drop-shadow(0 0 40px rgba(255,120,80,.8));animation:sunb 6s ease-in-out infinite}
@keyframes sunb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03)}}
.h-glow{left:50%;bottom:30%;width:90%;height:50%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(255,61,154,.55),transparent 65%)}
.h-city{left:0;bottom:36%;height:22%;width:200%;animation:drift 70s linear infinite}
.h-city.far{height:30%;opacity:.55;animation-duration:110s}
.h-city svg{display:block;width:100%;height:100%}
@keyframes drift{to{transform:translateX(-50%)}}
.h-floorwrap{left:0;right:0;bottom:0;height:36%;perspective:340px;overflow:hidden;background:linear-gradient(180deg,#14052f,#06020f);border-top:2px solid var(--cyan);box-shadow:0 -2px 24px rgba(45,226,230,.8)}
.h-floor{left:-60%;width:220%;top:0;height:260%;transform-origin:50% 0;transform:rotateX(68deg);
  background-image:linear-gradient(rgba(255,61,154,.95) 2px,transparent 2px),linear-gradient(90deg,rgba(45,226,230,.85) 2px,transparent 2px);background-size:64px 64px;animation:grid 1.6s linear infinite}
@keyframes grid{to{background-position:0 64px}}
.h-floorwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,5,47,.6),transparent 45%)}
.h-palms{left:0;right:0;bottom:0;height:78%;width:100%;pointer-events:none}
.h-palms .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.h-palms .sway.b{animation-duration:6.5s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.fc{position:absolute;width:clamp(64px,9.5vw,128px);transform-style:preserve-3d;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 18px 30px -8px rgba(0,0,0,.8),0 0 30px -4px var(--g,#ff3d9a);animation:flo 7s ease-in-out infinite;overflow:hidden}
.fc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
@keyframes flo{0%,100%{transform:translateY(0) rotateY(-24deg) rotateX(8deg) rotateZ(var(--rz,-6deg))}50%{transform:translateY(-16px) rotateY(24deg) rotateX(-6deg) rotateZ(calc(var(--rz,-6deg)*-1))}}
.h-scrim{inset:0;background:radial-gradient(ellipse 42% 50% at 50% 50%,rgba(8,3,20,.7) 0,rgba(8,3,20,.4) 60%,transparent 100%)}
.h-vig{inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,2,14,.6) 100%);pointer-events:none}
.ht{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;pointer-events:none}
.ht .badge{font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#fff;background:rgba(8,3,20,.85);border:1px solid var(--cyan);padding:5px 16px;border-radius:999px;box-shadow:0 0 16px rgba(45,226,230,.5)}
.ht h1{font-family:var(--font-d);font-weight:400;text-transform:uppercase;font-size:clamp(42px,9vw,112px);letter-spacing:.04em;line-height:.95;margin:12px 0 0;color:#fff;
  -webkit-text-stroke:2px #1a0633;paint-order:stroke fill;
  text-shadow:1px 1px 0 #ff3d9a,2px 2px 0 #f0308c,3px 3px 0 #de2a80,4px 4px 0 #c82474,5px 5px 0 #b11e68,6px 6px 0 #9a185c,7px 7px 0 #831250,8px 8px 0 #6c0c44,0 14px 22px rgba(0,0,0,.65),0 0 46px rgba(255,61,154,.45);animation:ttl 5s ease-in-out infinite alternate}
@keyframes ttl{from{transform:perspective(700px) rotateX(5deg) rotateY(-4deg)}to{transform:perspective(700px) rotateX(5deg) rotateY(4deg)}}
.ht h2{font-family:var(--font-d);font-weight:400;text-transform:uppercase;font-size:clamp(20px,3.6vw,42px);letter-spacing:.34em;margin:12px 0 0;color:#2de2e6;padding:2px 0 2px .34em;background:rgba(8,3,20,.8);border-radius:8px;
  -webkit-text-stroke:1px #04242a;paint-order:stroke fill;text-shadow:0 0 14px rgba(45,226,230,.85),2px 2px 0 #04242a}
.ht p{margin-top:12px;font-size:clamp(13px,1.6vw,17px);font-weight:500;color:#fff;max-width:58ch;background:rgba(8,3,20,.78);border:1px solid rgba(255,255,255,.18);padding:8px 18px;border-radius:12px;backdrop-filter:blur(6px)}

/* panels */
.panel{background:linear-gradient(180deg,rgba(33,19,71,.92),rgba(23,13,51,.96));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
.cfg{display:grid;gap:22px}
.sec{display:grid;gap:10px;border:0;margin:0;padding:0;min-width:0}
.sec h2{font-family:var(--font-d);font-weight:400;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--pink),var(--orange));color:var(--brand-ink);font-family:var(--font-ui);font-weight:700;font-size:14px;flex:0 0 auto;letter-spacing:0}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-top:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.seg button:hover{border-color:var(--pink)}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--pink),var(--orange));border-color:transparent;color:var(--brand-ink);font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.names label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.names input,.field select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mod{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2)}
.mod .sw{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--mf)}
.mod b{display:block;font-size:13.5px;line-height:1.2}
.mod small{color:var(--muted);font-size:12px}
.mod[aria-pressed="true"]{border-color:var(--pink);background:var(--soft);box-shadow:0 0 18px -6px var(--pink)}
.mod[aria-pressed="true"] .sw{background:var(--mb)}
.opt-row{display:flex;gap:10px;align-items:flex-start}
.opt-row input{width:18px;height:18px;margin-top:3px;accent-color:var(--pink);flex:0 0 auto}
.opt-row b{display:block}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.radios label:has(input:checked){border-color:var(--pink);background:var(--soft);box-shadow:0 0 18px -8px var(--pink)}
.radios input{margin-top:4px;accent-color:var(--pink)}
.radios b{display:block}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl button{text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2)}
.lvl button b{display:block;font-family:var(--font-d);font-weight:400;letter-spacing:.08em;font-size:20px;text-transform:uppercase}
.lvl button span{color:var(--muted);font-size:13.5px}
.lvl button[aria-pressed="true"]{border-color:var(--cyan);background:var(--soft);box-shadow:0 0 22px -6px var(--cyan)}
.lvl button[aria-pressed="true"] b{color:var(--cyan)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.how{display:grid;gap:14px}
.how h2{font-family:var(--font-d);font-weight:400;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.howstep{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.howstep h3{font-size:16px}
.howstep p{color:var(--muted);font-size:14px;margin-top:2px}
.anat{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.anat ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.anat li b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pink);color:var(--brand-ink);font-size:11px;margin-right:6px}
.risk{width:100%;border-collapse:collapse;font-size:14px}
.risk th,.risk td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
.risk th{color:var(--cyan);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px;color:var(--muted);font-size:13px}
.foot .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot .by{font-family:var(--font-d);letter-spacing:.1em;font-size:18px;color:var(--text);text-transform:uppercase}
.foot .by b{font-weight:400;color:var(--pink)}

/* play: strip */
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
.pchip{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;min-width:180px;padding:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:box-shadow .2s}
.pchip.active{border-color:var(--pink);box-shadow:var(--glow)}
.dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#14062a;font-weight:700;font-size:13px;grid-row:span 2;box-shadow:0 0 12px -2px currentColor}
.pchip .pn{font-weight:600;font-size:14px;line-height:1.2}
.pchip .ps{font-size:13px;color:var(--muted)}
.pchip .ps b{font-family:var(--font-d);font-weight:400;font-size:24px;color:var(--text);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.stripmeta{margin-left:auto;display:flex;gap:16px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.stripmeta b{color:var(--text)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--cyan);color:var(--cyan)}
.pill.pro{border-color:var(--pink);color:var(--pink)}

/* play: layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:start}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sec-head h2{font-family:var(--font-d);font-weight:400;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.boardscroll{overflow:auto;max-height:74vh;border-radius:16px;border:1px solid var(--line);
  background:
    linear-gradient(rgba(10,5,22,.55),rgba(10,5,22,.8)),
    repeating-linear-gradient(0deg,rgba(255,61,154,.12) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(90deg,rgba(45,226,230,.1) 0 1px,transparent 1px 44px),
    linear-gradient(180deg,#1d0c44,#0c0620)}
.board{display:grid;gap:8px;padding:16px;margin:0 auto}
.tc{padding:0;border:0;background:none;border-radius:9px;box-shadow:0 4px 18px -4px rgba(0,0,0,.8);position:relative;display:block;transition:transform .15s}
.tc:hover{transform:translateY(-2px)}
.tc.read{outline:3px solid var(--cyan);outline-offset:1px}
.tc.focus{outline:4px solid var(--pink);outline-offset:1px;box-shadow:0 0 30px -4px var(--pink)}
.tc.new{animation:drop .45s cubic-bezier(.2,1.4,.4,1)}
.tc.new::after{content:"just placed";position:absolute;top:-9px;left:6px;font-size:10px;font-weight:700;background:var(--pink);color:var(--brand-ink);padding:1px 8px;border-radius:999px}
@keyframes drop{from{transform:translateY(-30px) scale(1.15);opacity:0}to{transform:none;opacity:1}}
.blank{border-radius:9px}
.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px dashed var(--cyan);background:rgba(45,226,230,.08);color:var(--cyan);border-radius:10px;padding:2px;transition:background .15s,box-shadow .15s}
.open:hover{background:rgba(45,226,230,.2);box-shadow:0 0 22px -4px var(--cyan)}
.open .pl{font-size:24px;font-weight:600;line-height:1}
.open .pts{font-size:13px;font-weight:700;color:#fff}
.open .rk{font-size:12px;font-weight:700;color:var(--bad)}
.reader{margin-top:12px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.reader .none{grid-column:1/-1;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.reader dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.reader dt{color:var(--muted)}
.reader dd{margin:0}
.reader h3{font-family:var(--font-d);font-weight:400;font-size:22px;letter-spacing:.05em;margin-bottom:6px}

/* move panel */
.rightcol{display:grid;gap:14px}
.move{display:grid;gap:14px}
.who h2{font-family:var(--font-d);font-weight:400;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0;padding:0;list-style:none}
.stepper li{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px;border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.stepper li .sn{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--text);font-size:12px;flex:0 0 auto}
.stepper li.cur{background:var(--soft);color:var(--text);border-color:var(--pink)}
.stepper li.cur .sn{background:var(--pink);color:var(--brand-ink)}
.stepper li.done .sn{background:var(--good);color:#052018}
.move h3{font-size:17px}
.banner{padding:10px 12px;border-radius:12px;font-size:14px;background:var(--soft);border:1px solid var(--line)}
.banner.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.banner.bad{background:var(--bad-bg);color:#ffb3c0;border-color:transparent}
.warn{padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{padding:0;border:2px solid transparent;border-radius:11px;background:none;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.hc:hover{border-color:var(--pink);transform:translateY(-3px) rotate(-1deg)}
.hc[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.selcard{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
.selcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.selcard dt{color:var(--muted)}
.selcard dd{margin:0}
.pipt{font-family:var(--font-mono);letter-spacing:1px}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.brk{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.brk div{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line)}
.brk div:last-child{border-bottom:0;background:var(--soft);font-weight:700}
.accs{display:grid;gap:6px}
.acc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:6px 10px 6px 6px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2)}
.acc:hover{border-color:var(--pink)}
.acc .th{width:46px;flex:0 0 auto}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.pickrow button[aria-pressed="true"]{background:linear-gradient(90deg,var(--pink),var(--orange));color:var(--brand-ink);border-color:transparent}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;color:var(--muted);max-height:260px;overflow:auto}
.log blockquote{margin:3px 0 0;padding:4px 10px;border-left:3px solid var(--cyan);color:var(--text);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:12.5px}
.stake{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stake div{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.stake small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.stake b{font-family:var(--font-d);font-weight:400;font-size:28px;letter-spacing:.04em}
.stake .g b{color:var(--good)}.stake .r b{color:var(--bad)}

/* quiz */
.qz{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#1f1148,#150a33);box-shadow:inset 0 0 40px -20px var(--violet)}
.qq{font-weight:600;font-size:16px}
.qopts{display:grid;gap:8px}
.qo{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);transition:transform .12s,border-color .12s,box-shadow .12s}
.qo:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}
.qo[aria-pressed="true"]{border-color:var(--cyan);background:var(--soft);box-shadow:0 0 22px -8px var(--cyan)}
.qo .ql{display:grid;place-items:center;flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-d);font-size:15px}
.qo.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 0 24px -6px var(--good)}
.qo.bad{border-color:var(--bad);background:var(--bad-bg)}
.qo:disabled{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* tracker */
.tracker{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:1;max-width:340px;margin:0 auto}
.tk{position:relative;display:grid;place-items:center;border-radius:7px;border:1.5px solid var(--tkc);color:var(--tkc);font-size:11px;font-weight:600;font-family:var(--font-mono);min-height:0;background:rgba(10,5,22,.5)}
.tk.fill{background:var(--tkc);color:#14062a}
.tk.g{--tkc:#9b8fc9}.tk.t{--tkc:#2de2e6}.tk.p{--tkc:#ff3d9a}
.tk .ms{position:absolute;inset:auto 0 1px 0;display:flex;justify-content:center;flex-wrap:wrap;gap:1px}
.mp{display:grid;place-items:center;width:15px;height:15px;border-radius:50%;color:#14062a;font-size:9px;font-weight:700;border:1.5px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.mp.tip{border-radius:3px;transform:rotate(90deg) scaleX(1.25)}
.hexes{grid-area:3/3/5/5;border-radius:7px;background:repeating-linear-gradient(60deg,transparent 0 9px,rgba(255,61,154,.35) 9px 10px),repeating-linear-gradient(-60deg,transparent 0 9px,rgba(255,61,154,.35) 9px 10px)}
.tkcap{text-align:center;margin-top:8px}
.panel h2.pt{font-family:var(--font-d);font-weight:400;font-size:18px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;color:var(--orange)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,2,14,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:20}
.dialog{width:min(780px,100%);margin:auto;background:var(--surface);border:1px solid var(--pink);border-radius:18px;padding:22px;box-shadow:var(--glow)}
.dialog h2{font-family:var(--font-d);font-weight:400;font-size:30px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.dialog h3{font-size:17px;margin:18px 0 6px;color:var(--orange)}
.dialog ul,.dialog ol{padding-left:20px;display:grid;gap:6px;margin:8px 0}
.dfoot{margin-top:16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.toc a{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:8px 0}
.kv dt{font-weight:600}.kv dd{margin:0;color:var(--muted)}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0 14px}
.cust{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
.pipedit{display:grid;gap:6px}
.pipedit .row{display:flex;align-items:center;gap:8px}
.pipedit .row span.lb{width:56px;font-size:13px;font-weight:600}
.pipbtn{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);background:var(--surface-2);font-size:16px;font-weight:700;display:grid;place-items:center;padding:0}
.pipbtn[data-s="1"]{background:#f7f0ff;color:#14062a;border:2px solid #f7f0ff}
.pipbtn[data-s="0"]{border:2px solid #f7f0ff;background:transparent}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label,.field legend{font-size:13px;font-weight:600}
.field input[type=text]{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line)}
.swatches button[aria-pressed="true"]{border-color:#fff}
.mylist{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.mylist .it{width:100px;position:relative}
.mylist .it button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1;padding:0}

/* game over */
.over h1{font-family:var(--font-d);font-weight:400;text-transform:uppercase;font-size:clamp(34px,6vw,64px);letter-spacing:.04em;line-height:1;
  background:linear-gradient(180deg,#fff,var(--pink) 60%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,61,154,.5))}
.results{display:grid;gap:8px;margin:18px 0}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rrow.win{border-color:var(--gold);box-shadow:0 0 30px -8px var(--gold)}
.rrow .rs{font-family:var(--font-d);font-weight:400;font-size:38px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.rrow small{display:block;color:var(--muted)}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:10px}
.rev h3{display:flex;gap:10px;align-items:center;font-family:var(--font-d);font-weight:400;font-size:24px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.acc-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0 12px}
.acc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--gold))}
.rv{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:8px}
.rv b{display:block;color:var(--orange)}
.rv p{font-size:14px;color:var(--text);margin-top:3px}
.rv small{display:block;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 11px;border-radius:999px;border:1px solid var(--good);color:var(--good);font-size:13px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}

/* fx */
.fxpop{position:fixed;left:50%;top:32%;transform:translate(-50%,0);font-family:var(--font-d);font-size:clamp(64px,14vw,150px);letter-spacing:.04em;pointer-events:none;z-index:60;animation:pop 1.3s ease-out forwards;text-shadow:0 0 30px currentColor,0 6px 0 rgba(0,0,0,.5)}
.fxpop.good{color:var(--good)}.fxpop.bad{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,40px) scale(.6)}18%{opacity:1;transform:translate(-50%,0) scale(1.12)}70%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.fxflash{position:fixed;inset:0;pointer-events:none;z-index:55;animation:flash .5s ease-out forwards}
.fxflash.good{background:radial-gradient(circle,rgba(53,240,160,.28),transparent 70%)}
.fxflash.bad{background:radial-gradient(circle,rgba(255,84,112,.32),transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:15;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9}}


.streak{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--orange));color:var(--brand-ink);font-size:12px;font-weight:700;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.warm{background:var(--surface-2);border-color:var(--cyan);color:var(--cyan)}
.btn.warm:hover:not(:disabled){box-shadow:0 0 22px -6px var(--cyan)}
.sheetbtn{border-color:var(--cyan);color:var(--cyan)}
.rvb{margin-top:8px}
.overlay{animation:fadein .2s ease-out}
.dialog{animation:rise .3s cubic-bezier(.2,.9,.3,1)}
.over .rrow,.over .rev{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.over .rrow:nth-child(2){animation-delay:.08s}.over .rrow:nth-child(3){animation-delay:.16s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheetbar{display:grid;gap:8px;position:sticky;top:-22px;z-index:2;background:var(--surface);padding:10px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sq{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit}
.shm{display:flex;align-items:center;gap:10px;margin:18px 0 8px!important;color:var(--orange);font-family:var(--font-d);font-weight:400;font-size:20px!important;letter-spacing:.06em;text-transform:uppercase}
.shm .sw{width:18px;height:18px;border-radius:5px;border:2px solid}
.tp{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:8px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.tp.open{border-color:var(--pink);box-shadow:0 0 24px -12px var(--pink)}
.tp .th{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:0;text-align:left;font-weight:600;font-size:16px}
.tp .th:hover{background:rgba(255,255,255,.04)}
.tp ul{list-style:none;margin:0;padding:2px 14px 14px;display:grid;gap:8px;animation:rise .25s ease-out}
.dialog .tp ul{padding:2px 14px 14px}
.dialog .tp li{position:relative;padding-left:22px;font-size:15px;line-height:1.5;color:var(--text)}
.dialog .tp .th{color:var(--text)}
.tp li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--pink),var(--orange));transform:rotate(45deg)}
.dialog .tp li.trap{padding-left:28px;background:var(--warn-bg);border-radius:8px;padding:8px 10px 8px 28px;color:var(--warn)}
.tp li.trap::before{left:9px;top:1em;background:var(--warn)}
.tp li.trap b{text-transform:uppercase;letter-spacing:.1em;font-size:11px;margin-right:6px}

.hc{position:relative}
.hb{display:block;margin:5px 4px 4px;padding:1px 0;border-radius:999px;background:rgba(8,3,20,.88);color:#fff;font-size:11px;font-weight:700;text-align:center;letter-spacing:.04em}
.hc.dead{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
.hc.dead:hover{transform:none;border-color:transparent}
.hc.dead .hb{color:var(--bad)}
.open.dead{border-color:#4d3f7a;background:rgba(10,5,22,.55);color:#6f60a0;cursor:not-allowed}
.open.dead:hover{background:rgba(10,5,22,.55);box-shadow:none}
.open.dead .pl{font-size:18px}
.open.dead .rk{color:#6f60a0;font-weight:600}
.open .lk{font-size:11px;color:var(--cyan);font-weight:700}
.pairrow{display:flex;align-items:center;justify-content:center;gap:10px}
.pairrow figure{margin:0;width:112px;text-align:center}
.pairrow .pf{border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.pairrow figcaption{font-size:12px;color:var(--muted);line-height:1.3;margin-top:4px}
.pairrow figcaption b{color:var(--text);font-size:13px}
.pairrow .arrow{font-size:30px;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.linkwhy{padding:8px 12px;border-left:3px solid var(--cyan);background:var(--surface-2);border-radius:0 10px 10px 0}
@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .rightcol{order:-1}
  .setup{grid-template-columns:1fr}
}
@media (max-width:700px){.fc.hide-s{display:none}.h-floorwrap{perspective:220px}}
@media (max-width:560px){
  .wrap{padding:10px}
  .stepper li{font-size:11.5px;padding:6px}
  .dialog{padding:16px}
  .selcard,.reader,.cust{grid-template-columns:1fr}
  .anat{grid-template-columns:1fr}
  .selcard .face,.reader .face{max-width:220px}
  .lvl{grid-template-columns:1fr}
  .lock .nm{font-size:19px}
  .revs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
