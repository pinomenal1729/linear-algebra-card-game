function readerHTML(){
  var k=S.info;
  if(!k||!cardOf(k)||Object.keys(S.table).every(function(x){return S.table[x]!==k;}))return '<p class="none">Click a card on the table to read it larger and see its pips.</p>';
  var c=cardOf(k),m=modOf(c);
  return '<div>'+face(c)+'</div><div><h3>'+esc(c.t)+'</h3><dl><dt>Identifier</dt><dd>'+esc(c.id)+'</dd><dt>Points</dt><dd>'+c.p+'</dd><dt>Module</dt><dd>'+(c.m<8?'M'+c.m+' ':'')+esc(m.n)+'</dd>'+
    ['t','r','b','l'].map(function(sd){var a=c.pips[sd];return '<dt>'+SIDE_NAME[sd]+' pips</dt><dd><span class="pipt">'+pipStr(a)+'</span>'+(a.length?' <span class="'+(pipSum(a)>=0?'pos':'neg')+'">'+signed(pipSum(a))+'</span>':'')+'</dd>';}).join('')+'</dl></div>';
}

function quizBody(j,card,p){
  var strict=S.cfg.variant==='strict';
  var head='<h3>Connect the cards</h3>';
  if(!j.quiz){
    var res0={targets:targetsFor(card,j.r,j.c)};
    return head+'<p class="help">Your card <b>'+esc(card.t)+'</b> connects to '+res0.targets.length+' neighbouring cards. Choose the one you want to explain. You then answer one question about that exact link.</p><div class="accs">'+
      res0.targets.map(function(t){var rc=tk(t.r,t.c),o={};o[rc]=true;var pr=calcPoints(card,j.r,j.c,o);return '<button class="acc" data-action="qpick" data-rc="'+rc+'"><span class="th">'+face(cardOf(t.k))+'</span><span>'+esc(cardOf(t.k).t)+'<br><span class="fine">win +'+pr.total+' · risk −'+riskFor(pr.total)+'</span></span></button>';}).join('')+'</div>'+
      '<div class="actions"><button class="btn quiet" data-action="skip">Skip: take the card back, no penalty</button></div>';
  }
  var z=j.quiz,q=z.q,letters='ABCD',nb=cardOf(z.tk);
  var pair='<div class="pairrow"><figure><div class="pf">'+face(card)+'</div><figcaption>Your card<br><b>'+esc(card.t)+'</b></figcaption></figure><span class="arrow" aria-hidden="true">\u2194</span><figure><div class="pf">'+face(nb)+'</div><figcaption>Connect to<br><b>'+esc(nb.t)+'</b></figcaption></figure></div>';
  var res=calcPoints(card,j.r,j.c,strict?null:(function(){var o={};o[z.rc]=true;return o;})());
  var opts=q.opts.map(function(o,oi){
    var cls='qo';
    if(z.done){if(o.ok)cls+=' ok';else if(z.pick===oi)cls+=' bad';}
    return '<button class="'+cls+'" data-action="qans" data-o="'+oi+'" aria-pressed="'+(z.pick===oi)+'"'+(z.done?' disabled':'')+'><span class="ql">'+letters[oi]+'</span><span>'+esc(o.t)+'</span></button>';
  }).join('');
  var lost=Math.min(z.risk,p.score);
  var stake='<div class="stake"><div class="g"><small>Win if correct</small><b>+'+res.total+'</b></div><div class="r"><small>Lose if wrong</small><b>−'+z.risk+'</b></div></div>';
  var pill='<span class="pill'+(S.cfg.level==='pro'?' pro':'')+'">'+(S.cfg.level==='pro'?'Pro':'Beginner')+'</span>';
  var note=q.note?'<p class="fine">'+esc(q.note)+'</p>':'';
  var fb='';
  if(z.done)fb=z.ok?'<p class="banner good"><b>Correct.</b> '+(q.kind==='odd'?'That was the false statement.':'You connected them.')+'</p>':'<p class="banner bad"><b>Not correct.</b> '+(q.kind==='odd'?esc(q.truth):'The right statement was: '+esc(q.truth))+'</p>';
  var brk='<div class="brk"><div><span>Your card ('+esc(card.t)+')</span><span>'+(strict||res.accepted.length?card.p:0)+'</span></div><div><span>'+(strict?'Other cards in the row and column ('+res.targets.length+')':'Connected neighbour')+'</span><span>'+res.lineSum+'</span></div>'+
    (res.parts.length?res.parts.map(function(x){return '<div><span>'+SIDE_NAME[x.side]+' side pips <span class="pipt">'+pipStr(x.arr)+'</span></span><span class="'+(x.sum>=0?'pos':'neg')+'">'+signed(x.sum)+'</span></div>';}).join(''):'<div><span>Side pips</span><span>0</span></div>')+
    '<div><span>'+(z.done&&!z.ok?'Result':'Worth if correct')+'</span><span>'+(z.done&&!z.ok?(lost?'−'+lost:'0'):res.total)+'</span></div></div>';
  var foot;
  if(!z.done){
    foot='<div class="actions"><button class="btn primary" data-action="qsubmit"'+(z.pick>=0?'':' disabled')+'>Lock in my answer</button>'+(!strict?'<button class="btn" data-action="qback">Choose another card</button>':'')+'<button class="btn quiet" data-action="skip">Skip, no penalty</button></div>';
  }else if(z.ok){
    foot='<div class="actions"><button class="btn good" data-action="agree">Collect '+res.total+' point'+(res.total===1?'':'s')+'</button></div>';
  }else{
    foot='<div class="actions"><button class="btn primary" data-action="disagree">Take the card back'+(lost?' (−'+lost+')':'')+'</button></div>';
  }
  return head+pair+'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+pill+'<span class="help">Choose the one '+(q.kind==='odd'?'FALSE':'correct')+' statement. Keys: A\u2013D, then Enter.</span></div>'+stake+'<div class="qz"><p class="qq">'+esc(q.text)+'</p><div class="qopts">'+opts+'</div></div>'+note+fb+(z.done&&q.link?'<p class="fine linkwhy"><b>Why they connect:</b> '+esc(q.link)+'</p>':'')+brk+foot;
}

function stepBody(step,p){
  var h;
  if(step===1){
    if(S.cfg.hide&&!S.revealed){
      return '<h3>Pass the screen to '+esc(p.name)+'</h3><p class="help">Hands are secret. Everyone else should look away, then '+esc(p.name)+' taps below.</p><div><button class="btn primary" data-autofocus data-action="reveal">Show '+esc(p.name)+'’s hand</button></div>';
    }
    if(S.mode==='pass'){
      h=p.hand.map(function(k){var on=S.discardSel.indexOf(k)>=0;return '<button class="hc" data-action="dsel" data-k="'+k+'" aria-pressed="'+on+'" aria-label="'+(on?'Keep ':'Discard ')+esc(label(cardOf(k)))+'">'+face(cardOf(k))+'</button>';}).join('');
      var n=S.discardSel.length;
      return '<h3>Pass: choose cards to discard</h3><p class="help">Tap the cards you want to throw away. You draw the same number of new cards. Discarded cards are out of the game.</p><div class="hand">'+h+'</div>'+
        '<div class="actions"><button class="btn" data-action="dselstuck">Select cards I can\u2019t place</button><button class="btn primary" data-action="passgo">'+(n?'Discard '+n+' and draw '+n:'Pass without discarding')+'</button><button class="btn" data-action="cancelpass">Cancel</button></div>';
    }
    var sc={},alive=0;
    p.hand.forEach(function(k){sc[k]=spotCount(k);if(sc[k])alive++;});
    h=p.hand.map(function(k){var n=sc[k];return '<button class="hc'+(n?'':' dead')+'"'+(n?' data-action="pick" data-k="'+k+'"':' disabled')+' aria-label="'+(n?'Play ':'Cannot place ')+esc(label(cardOf(k)))+(n?' ('+n+' possible spot'+(n===1?'':'s')+')':'')+'">'+face(cardOf(k))+'<span class="hb">'+(n?n+(n===1?' spot':' spots'):'no spot')+'</span></button>';}).join('');
    var tip=!p.hand.length?'<p class="warn">Your hand is empty. You can only pass.</p>':(alive?'<div class="hand">'+h+'</div><p class="help">A card can only go next to a card it genuinely connects to. Cards marked “no spot” don’t connect to anything on the table right now.</p>':'<div class="hand">'+h+'</div><p class="warn"><b>None of your cards connects to the table.</b> Swap: discard the cards you can’t use and draw new ones.</p>');
    return '<h3>Play a card, or swap</h3>'+tip+'<div class="actions"><button class="btn'+(alive||!p.hand.length?'':' primary')+'" data-action="passmode">'+(alive?'Pass instead':'Swap cards')+'</button></div>';
  }
  if(step===2){
    var c=cardOf(S.selected);
    return '<h3>Place it on the table</h3><div class="selcard"><div>'+face(c)+'</div><div><dl><dt>Points</dt><dd>'+c.p+'</dd>'+
      ['t','r','b','l'].map(function(sd){var a=c.pips[sd];return '<dt>'+SIDE_NAME[sd]+'</dt><dd><span class="pipt">'+pipStr(a)+'</span>'+(a.length?' <span class="'+(pipSum(a)>=0?'pos':'neg')+'">'+signed(pipSum(a))+'</span>':'')+'</dd>';}).join('')+'</dl></div></div>'+
      '<p class="help">Click a dashed spot. Only spots next to a card yours genuinely connects to are open (the faded ones are closed). Each open spot shows what you win, what you risk, and how many cards it links to.</p>'+
      '<div class="actions"><button class="btn" data-action="unpick">Choose a different card</button></div>';
  }
  return quizBody(S.judge,cardOf(S.judge.k),p);
}

function logLi(x){return '<li>'+esc(x.t)+(x.e?'<blockquote>'+esc(x.e)+'</blockquote>':'')+'</li>';}

function viewPlay(){
  var p=S.players[S.turn];
  var step=S.judge?3:(S.selected?2:1);
  var chips=S.players.map(function(pl,i){
    return '<div class="pchip'+(i===S.turn?' active':'')+'"><span class="dot" style="background:'+PCOL[i]+';color:'+PCOL[i]+'"><span style="color:#14062a">'+(i+1)+'</span></span><span class="pn">'+esc(pl.name)+(i===S.start&&S.players.length>1?' <span class="fine">(started)</span>':'')+((pl.streak||0)>=2?' <span class="streak" title="Correct answers in a row">\ud83d\udd25'+pl.streak+'</span>':'')+'</span><span class="ps"><b>'+pl.score+'</b> / '+S.cfg.target+(i===S.turn?' · playing':'')+'</span></div>';
  }).join('');
  var vname={strict:'Strict',adjacent:'Adjacent',flexible:'Flexible'}[S.cfg.variant];
  var strip='<div class="strip">'+chips+'<div class="stripmeta"><span>Round <b>'+S.round+'</b></span><span>Deck <b>'+S.deck.length+'</b></span><span>Mode <b>'+vname+'</b></span><span class="pill'+(S.cfg.level==='pro'?' pro':'')+'">'+(S.cfg.level==='pro'?'Pro':'Beginner')+'</span>'+
    (S.endTriggered?'<span><b>Final round</b></span>':'')+'</div></div>';
  var sizes=[[96,'S'],[120,'M'],[150,'L']].map(function(x){return '<button data-action="size" data-v="'+x[0]+'" aria-pressed="'+(S.size===x[0])+'">'+x[1]+'</button>';}).join('');
  var left='<section><div class="sec-head"><h2>The table</h2><div class="pickrow" role="group" aria-label="Card size">'+sizes+'</div></div><div class="boardscroll" id="boardscroll">'+viewBoard()+'</div><div class="reader" id="reader">'+readerHTML()+'</div></section>';
  var steps=['Choose','Place','Quiz'].map(function(t,k){
    var n=k+1;
    return '<li class="'+(n===step?'cur':(n<step?'done':''))+'"'+(n===step?' aria-current="step"':'')+'><span class="sn">'+(n<step?'✓':n)+'</span>'+t+'</li>';
  }).join('');
  var banner=S.note?'<p class="banner '+(S.noteKind||'info')+'" aria-live="polite">'+esc(S.note)+'</p>':'';
  var move='<div class="panel move"><div class="who"><h2>'+esc(p.name)+(S.players.length>1?'’s move':', your move')+'</h2></div>'+banner+'<ol class="stepper">'+steps+'</ol>'+stepBody(step,p)+'</div>';
  var tracker='<div class="panel"><h2 class="pt">Score tracker</h2>'+trackerHTML()+'</div>';
  var logs='<div class="panel"><h2 class="pt">Recent moves</h2>'+(S.log.length?'<ul class="log">'+S.log.slice(0,10).map(logLi).join('')+'</ul>':'<p class="fine">Nothing yet.</p>')+'</div>';
  return viewHeader()+strip+'<main class="layout">'+left+'<aside class="rightcol">'+move+tracker+logs+'</aside></main>'+footer();
}

function viewOver(){
  var max=Math.max.apply(null,S.players.map(function(p){return p.score;}));
  var tied=S.players.filter(function(p){return p.score===max;});
  var winner=null,head;
  if(S.players.length===1){head='Final score: '+max;}
  else{
    if(tied.length===1)winner=tied[0];
    else{
      var rc=tied.filter(function(p){return p.reached!==null;}).sort(function(a,b){return a.reached-b.reached;});
      if(rc.length)winner=rc[0];
    }
    head=winner?winner.name+' wins':'A tie at '+max;
  }
  var note=(S.players.length>1&&tied.length>1&&winner)?'<p class="help">Tie-break: '+esc(winner.name)+' was the first to reach '+S.cfg.target+' points.</p>':'';
  var order=S.players.map(function(p,i){return {p:p,i:i};}).sort(function(a,b){return b.p.score-a.p.score;});
  var rows=order.map(function(o){
    return '<div class="rrow'+(winner&&o.p===winner?' win':'')+'"><span style="display:flex;gap:10px;align-items:center"><span class="dot" style="background:'+PCOL[o.i]+';color:'+PCOL[o.i]+'"><span style="color:#14062a">'+(o.i+1)+'</span></span><span><b>'+esc(o.p.name)+(winner&&o.p===winner?' 🏆':'')+'</b><small>'+o.p.ok+' correct · '+o.p.bad+' missed · '+o.p.skip+' skipped'+((o.p.best||0)>=2?' · best streak '+o.p.best:'')+'</small></span></span><span class="rs">'+o.p.score+'</span></div>';
  }).join('');
  var revs=S.players.map(function(p,i){
    var rv=revision(p);
    var weak=rv.weak.slice(0,5).map(function(k){
      var r=p.topics[k];
      return '<div class="rv"><b>'+esc(QD.tags[k][0])+'</b><p>'+esc(QD.tags[k][1])+'</p><small>'+(r.bad?'Missed '+r.bad+'×':'')+(r.bad&&r.skip?', ':'')+(r.skip?'skipped '+r.skip+'×':'')+(r.cards.length?' · on: '+esc(r.cards.join(', ')):'')+'</small><button class="btn sm rvb" data-action="sheetjump" data-k="'+k+'">Revise this \u2192</button></div>';
    }).join('');
    var strong=rv.strong.slice(0,8).map(function(k){return '<span class="chip">'+esc(QD.tags[k][0])+'</span>';}).join('');
    var body;
    if(!rv.tot&&!p.skip)body='<p class="help">No questions answered, so there is nothing to analyse yet.</p>';
    else{
      body='<div class="acc-bar" role="img" aria-label="Accuracy '+rv.pct+' percent"><i style="width:'+rv.pct+'%"></i></div>'+
        (weak?'<p class="sub" style="margin-bottom:8px">Revise these topics</p>'+weak:'<p class="banner good">No weak spots from this game. Great work!</p>')+
        (strong?'<p class="sub" style="margin:12px 0 8px">Solid on</p><div class="chips">'+strong+'</div>':'');
    }
    return '<div class="panel rev"><h3><span class="dot" style="background:'+PCOL[i]+';color:'+PCOL[i]+'"><span style="color:#14062a">'+(i+1)+'</span></span>'+esc(p.name)+'</h3><p class="help">'+(rv.tot?rv.pct+'% correct ('+p.ok+' of '+rv.tot+')':'No answered questions')+'</p>'+body+'</div>';
  }).join('');
  var disc=S.discard.length?'<h2 class="disp" style="margin-top:26px;font-size:26px">Discarded cards</h2><p class="help">Optional: discuss these cards and the connections you missed.</p><div class="gal">'+S.discard.map(function(k){return '<div>'+face(cardOf(k))+'</div>';}).join('')+'</div>':'';
  return viewHeader()+'<section class="over"><p class="sub">Game over</p><h1>'+esc(head)+'</h1>'+note+'<div class="results">'+rows+'</div>'+
    '<h2 class="disp" style="margin-top:26px;font-size:30px">Your revision plan</h2><p class="help">Built from the questions each player answered in this game. <button class="btn sm" data-action="sheet">\ud83d\udcd8 Open the full revision sheet</button></p><div class="revs">'+revs+'</div>'+
    '<div class="panel" style="max-width:380px;margin-top:20px"><h2 class="pt">Final track</h2>'+trackerHTML()+'</div>'+
    '<div style="margin-top:20px"><button class="btn primary big" data-action="again">New game</button></div>'+disc+'</section>'+footer();
}

function sh(){return S.sheet||(S.sheet={q:'',mod:-1,open:{}});}
function sheetMatch(k,q){
  if(!q)return true;
  var s=(QD.tags[k][0]+' '+REV[k].join(' ')).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){return !w||s.indexOf(w)>=0;});
}
function sheetPts(k){
  return REV[k].map(function(x){var tr=x.indexOf('Trap: ')===0;return '<li class="'+(tr?'trap':'')+'">'+(tr?'<b>Trap</b> '+esc(x.slice(6)):esc(x))+'</li>';}).join('');
}
function sheetList(){
  var s=sh(),out='';
  GROUPS.forEach(function(g){
    if(s.mod>=0&&s.mod!==g[0])return;
    var items=g[1].filter(function(k){return REV[k]&&sheetMatch(k,s.q);});
    if(!items.length)return;
    var m=MODS[g[0]];
    out+='<h3 class="shm"><span class="sw" style="background:'+m.bg+';border-color:'+m.fg+'"></span>M'+g[0]+' '+esc(m.n)+'</h3>';
    items.forEach(function(k){
      var op=!!s.open[k];
      out+='<div class="tp'+(op?' open':'')+'" id="sh-'+k+'"><button class="th" data-action="sheettog" data-k="'+k+'" aria-expanded="'+op+'"><span>'+esc(QD.tags[k][0])+'</span><span class="fine">'+REV[k].length+' key points '+(op?'\u25B4':'\u25BE')+'</span></button>'+(op?'<ul>'+sheetPts(k)+'</ul>':'')+'</div>';
    });
  });
  return out||'<p class="help">No topic matches that search.</p>';
}
function sheetChips(){
  var s=sh(),h='<button type="button" data-action="sheetmod" data-v="-1" aria-pressed="'+(s.mod<0)+'">All</button>';
  MODS.forEach(function(m,i){h+='<button type="button" data-action="sheetmod" data-v="'+i+'" aria-pressed="'+(s.mod===i)+'" title="'+esc(m.n)+'">M'+i+'</button>';});
  return h;
}
function refreshSheet(){
  var l=document.getElementById('sheetlist'),c=document.getElementById('sheetchips');
  if(l)l.innerHTML=sheetList();
  if(c)c.innerHTML=sheetChips();
}
function viewModal(){
  var m=S.modal;
  if(m==='sheet'){
    return '<div class="overlay"><div class="dialog sheet" style="width:min(900px,100%)" role="dialog" aria-modal="true" aria-labelledby="sht"><h2 id="sht">Revision sheet</h2>'+
      '<p class="help">The most important ideas for each topic, as a warm-up before you play or a recap afterwards. Tap a topic to open it. The game questions test exactly these ideas.</p>'+
      '<div class="sheetbar"><input type="search" class="sq" data-sheetq placeholder="Search topics, e.g. eigen, rank, projection" value="'+esc(sh().q)+'" aria-label="Search the revision sheet"><div class="pickrow" id="sheetchips" role="group" aria-label="Filter by module">'+sheetChips()+'</div><div class="pickrow"><button type="button" data-action="sheetall" data-v="open">Expand all</button><button type="button" data-action="sheetall" data-v="close">Collapse all</button></div></div>'+
      '<div id="sheetlist">'+sheetList()+'</div>'+
      '<div class="dfoot"><button class="btn primary" data-autofocus data-action="close">Close</button></div></div></div>';
  }
  if(m==='rules'){
    return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rt"><h2 id="rt">Rules</h2>'+
    '<div class="toc"><a href="#r-desc">Description</a><a href="#r-comp">Components</a><a href="#r-setup">Setup</a><a href="#r-play">Playing</a><a href="#r-win">Winning</a><a href="#r-var">Game modes</a><a href="#r-quiz">Quiz and risk</a><a href="#r-credits">Credits</a></div>'+
    '<h3 id="r-desc">Description</h3><p>An educational game for 2 to 6 players (or solo) to learn key concepts and surprising connections in linear algebra. Players take turns placing cards in the middle of the table in a grid and showing how the concept on their card connects to other cards. Each successful connection earns points. The player with the most points at the end wins.</p>'+
    '<h3 id="r-comp">Components</h3><ul><li><b>Cards.</b> Each card shows a concept, theorem or example, a point value, a module number and an identifier (for example #M0-001). Pips on the edges: filled circles add directional bonus points, empty circles subtract points. A module is one of eight themed groups of related concepts, shown by colour. The deck has 193 cards because the PDF prints #M3-091 twice.</li><li><b>Scoreboard.</b> Each player has a coloured meeple on the score tracker, starting at 0.</li><li><b>Blank tiles.</b> Use “Add your own cards” on the setup page.</li></ul>'+
    '<h3 id="r-setup">Setup</h3><ol><li>Choose one or more modules and shuffle them into the draw deck.</li><li>Draw the top card and put it face up in the middle of the table.</li><li>Each player gets a meeple at 0.</li><li>Choose a target: 30 points for a standard game, 50 for a longer one (the meeple lies on its side after 30).</li><li>The player who touched a linear algebra book most recently starts (or the youngest).</li><li>Everyone draws 6 cards and keeps them hidden.</li></ol>'+
    '<h3 id="r-play">Playing the game</h3><p>The game is played in rounds. In a round every player takes one turn, in order. On your turn you either play one card and connect it, or pass.</p>'+
    '<dl class="kv"><dt>Placing</dt><dd>Put a card from your hand next to a card on the table, horizontally or vertically.</dd><dt>Connecting</dt><dd>In the box game you explain how your card relates to all the other cards in the row and column. In this edition you answer a question about the connection instead (see Quiz and risk).</dd><dt>Scoring</dt><dd>If you connect successfully you earn the sum of all the cards in the row and column plus the directional bonuses (which can be negative) from every side you connected with other cards. Bonuses apply only once, when you play the card from your hand. Then draw a new card. A single move never scores below 0.</dd><dt>If you fail</dt><dd>Take your card back into your hand.</dd><dt>Passing</dt><dd>Discard as many cards from your hand as you like, then draw the same number of new cards.</dd></dl>'+
    '<h3 id="r-win">Winning the game</h3><p>When a player has at least 30 points (or 50 in the longer game), finish the current round. The player with the most points at the end of the round wins. In a tie, the first player who reached the target wins. Afterwards you can discuss the discarded cards.</p>'+
    '<h3 id="r-var">Game modes</h3><ul><li><b>Strict (default).</b> You answer about one neighbouring card. A correct answer scores every card in the row and column.</li><li><b>Adjacent and Flexible.</b> You choose one neighbour to connect with, and only that neighbour scores. (In the box game Flexible lets you connect several neighbours at once. With one question per turn, both modes work the same here.)</li></ul>'+
    '<h3 id="r-quiz">Quiz and risk (this edition)</h3><p><b>Real connections only.</b> A card can only be placed next to a card it genuinely connects to (the same topic, or two topics that are directly related). Spots without a connection are closed. If none of your cards connects to the table, swap cards by passing. After placing a card you answer one multiple-choice question about the link between the two cards, with four statements. In <b>Beginner</b> exactly one statement is correct and the others are plain wrong. In <b>Pro</b> the wrong statements are close look-alikes, and about half of the questions flip it round: three statements are true and you must find the false one.</p>'+
    '<table class="risk" style="margin-top:10px"><tr><th>Points at stake</th><th>Penalty if wrong</th></tr><tr><td>1–3</td><td>−1</td></tr><tr><td>4–6</td><td>−2</td></tr><tr><td>7–9</td><td>−3</td></tr><tr><td>10 or more</td><td>−4</td></tr></table>'+
    '<p style="margin-top:8px">A wrong answer sends the card back to your hand and costs the penalty (scores never go below 0). You can also skip the question: no points and no penalty. At the end of the game each player gets a revision plan made from their own answers.</p>'+
    '<h3 id="r-credits">Credits</h3><p>Original game design: Martijn Boussé, Monica Salvioli, Philippe Dreesen, Max Sondag, Marieke Musegaas, Ralf Peeters. Graphic design and artwork: Henrique Athayde. Special thanks: Gavin Phillips, Pietro Bonizzi, Evert Hoogendoorn, Willem-Jan Renger, Tracy Craig, Tuğçe Akkaya, and all staff and students from Maastricht University’s Faculty of Science and Engineering who playtested the game.</p><p class="fine" style="margin-top:8px">Linear Algebra Card Game © 2026 Martijn Boussé, Monica Salvioli, Philippe Dreesen, Max Sondag, Marieke Musegaas and Ralf Peeters, licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International</a>. <a href="https://www.linearalgebragame.eu" target="_blank" rel="noopener">www.linearalgebragame.eu</a>. Digital adaptation by Anupam Nigam | MathSphere.</p>'+
    '<div class="dfoot"><button class="btn primary" data-autofocus data-action="close">Close</button></div></div></div>';
  }
  if(m==='deck'){
    var secs=MODS.map(function(md,i){
      var cs=BASE.filter(function(c){return c.m===i;});
      return '<h3>M'+i+' '+esc(md.n)+' <span class="fine">('+cs.length+' cards)</span></h3><div class="deckgrid">'+cs.map(function(c){return '<div title="'+esc(label(c))+'">'+face(c)+'</div>';}).join('')+'</div>';
    }).join('');
    if(S.custom.length)secs+='<h3>Your own cards</h3><div class="deckgrid">'+S.custom.map(function(c){return '<div>'+face(c)+'</div>';}).join('')+'</div>';
    return '<div class="overlay"><div class="dialog" style="width:min(1100px,100%)" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">All cards</h2><p class="help">The full print-and-play deck, grouped by module.</p>'+secs+'<div class="dfoot"><button class="btn primary" data-autofocus data-action="close">Close</button></div></div></div>';
  }
  if(m==='tracker'){
    return '<div class="overlay"><div class="dialog" style="width:min(460px,100%)" role="dialog" aria-modal="true" aria-labelledby="tt"><h2 id="tt">Score tracker</h2>'+trackerHTML()+
      '<div class="dfoot"><button class="btn primary" data-autofocus data-action="close">Close</button></div></div></div>';
  }
  if(m==='quit'){
    return '<div class="overlay"><div class="dialog" style="width:min(440px,100%)" role="alertdialog" aria-modal="true" aria-labelledby="xt"><h2 id="xt">End the game now?</h2><p class="help">Scores so far are kept and shown on the results screen, together with your revision plan.</p><div class="dfoot"><button class="btn" data-autofocus data-action="close">Keep playing</button><button class="btn primary" data-action="quitnow">End game</button></div></div></div>';
  }
  if(m==='custom'){
    var d=S.draft||newDraft();
    var prev={id:'#C-'+('00'+(S.custom.length+1)).slice(-3),t:d.t,p:d.p,c:d.c,pips:{},custom:true};
    ['t','r','b','l'].forEach(function(sd){prev.pips[sd]=d.pips[sd].filter(function(v){return v!=='';}).map(function(v){return v==='1'?1:0;});});
    var sw=MODS.map(function(md,i){return '<button type="button" data-action="dcolor" data-v="'+i+'" aria-pressed="'+(d.c===i)+'" aria-label="Colour of module M'+i+'" title="Colour of M'+i+' '+esc(md.n)+'" style="background:'+md.bg+'"></button>';}).join('');
    var pe=['t','r','b','l'].map(function(sd){
      return '<div class="row"><span class="lb">'+SIDE_NAME[sd]+'</span>'+[0,1,2].map(function(i){var v=d.pips[sd][i];return '<button type="button" class="pipbtn" data-action="dpip" data-side="'+sd+'" data-i="'+i+'" data-s="'+v+'" aria-label="'+SIDE_NAME[sd]+' pip '+(i+1)+': '+(v===''?'empty slot':(v==='1'?'filled':'hollow'))+'">'+(v===''?'+':'')+'</button>';}).join('')+'</div>';
    }).join('');
    var mine=S.custom.length?'<div class="mylist">'+S.custom.map(function(c){return '<div class="it">'+face(c)+'<button data-action="ddel" data-k="'+c.k+'" aria-label="Delete '+esc(c.t)+'">×</button></div>';}).join('')+'</div>':'<p class="fine">No cards yet.</p>';
    return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ct"><h2 id="ct">Your own cards</h2><p class="help">Use the blank tiles to add concepts to a module colour. Cards are kept in this browser. Quiz questions for your own cards ask about the topic area.</p>'+
      '<div class="cust" style="margin-top:12px"><div>'+customFace(prev,true)+'</div><div>'+
      '<div class="field"><label for="dname">Concept</label><input type="text" id="dname" data-draft="t" maxlength="60" value="'+esc(d.t)+'" placeholder="e.g. Rank of a matrix"></div>'+
      '<div class="field"><legend>Points</legend><div class="pickrow">'+[1,2,3].map(function(n){return '<button type="button" data-action="dpts" data-v="'+n+'" aria-pressed="'+(d.p===n)+'">'+n+'</button>';}).join('')+'</div></div>'+
      '<div class="field"><legend>Colour (module)</legend><div class="swatches">'+sw+'</div></div>'+
      '<div class="field"><legend>Pips on each side (tap a slot: filled, hollow, empty)</legend><div class="pipedit">'+pe+'</div></div>'+
      '<button class="btn primary" data-action="dadd"'+(d.t.trim()?'':' disabled')+'>Add this card</button></div></div>'+
      '<h3>Your cards</h3>'+mine+
      '<div class="dfoot"><button class="btn primary" data-autofocus data-action="close">Done</button></div></div></div>';
  }
  return '';
}

function render(){
  var bs=document.getElementById('boardscroll');
  var bl=bs?bs.scrollLeft:0,bt=bs?bs.scrollTop:0,wy=window.scrollY;
  var ov=app.querySelector('.overlay'),ot=ov?ov.scrollTop:0;
  var html=S.phase==='setup'?viewSetup():(S.phase==='play'?viewPlay():viewOver());
  app.innerHTML=html+viewModal();
  bs=document.getElementById('boardscroll');
  if(bs){bs.scrollLeft=bl;bs.scrollTop=bt;}
  window.scrollTo(0,wy);
  var nov=app.querySelector('.overlay');
  if(nov&&ov)nov.scrollTop=ot;
  if(S.jump){var je=document.getElementById('sh-'+S.jump);S.jump=null;if(je)je.scrollIntoView({block:'center'});}
  var f=app.querySelector('[data-autofocus]');
  if(f&&!(nov&&ov&&document.activeElement&&nov.contains(document.activeElement)))f.focus({preventScroll:true});
}

app.addEventListener('click',function(e){
  var a=e.target.closest('a[href^="#r-"]');
  if(a){e.preventDefault();var el=document.getElementById(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({block:'start'});return;}
  var t=e.target.closest('[data-action]');
  if(!t||t.disabled)return;
  act(t.dataset.action,t.dataset);
});
app.addEventListener('mousemove',function(e){
  var h=e.target.closest&&e.target.closest('#hero');
  if(!h)return;
  var r=h.getBoundingClientRect();
  h.style.setProperty('--mx',(((e.clientX-r.left)/r.width)*2-1).toFixed(3));
  h.style.setProperty('--my',(((e.clientY-r.top)/r.height)*2-1).toFixed(3));
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(!t.dataset)return;
  if(t.dataset.sheetq!==undefined){sh().q=t.value;var sl=document.getElementById('sheetlist');if(sl)sl.innerHTML=sheetList();return;}
  if(t.dataset.name!==undefined){S.setup.names[+t.dataset.name]=t.value;return;}
  if(t.dataset.vol!==undefined){
    AU.vol=+t.value;saveSnd();
    if(AU.master)AU.master.gain.value=AU.vol;
    return;
  }
  if(t.dataset.draft==='t'){
    S.draft.t=t.value;
    var pv=document.getElementById('pv-title');if(pv)pv.textContent=t.value||'Your concept';
    var add=app.querySelector('[data-action="dadd"]');if(add)add.disabled=!t.value.trim();
  }
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.opt){
    var o=t.dataset.opt;
    if(o==='start'){S.setup.start=+t.value;return;}
    S.setup[o]=t.checked;render();return;
  }
  if(t.dataset&&t.dataset.var){S.setup.variant=t.dataset.var;render();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return;}
  if(!S||S.phase!=='play'||S.modal||!S.judge||!S.judge.quiz||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  var z=S.judge.quiz,i='abcd1234'.indexOf(String(e.key).toLowerCase());
  if(!z.done){
    if(String(e.key).length===1&&i>=0){act('qans',{o:i%4});e.preventDefault();}
    else if(e.key==='Enter'&&z.pick>=0){act('qsubmit',{});e.preventDefault();}
  }else if(e.key==='Enter'){act(z.ok?'agree':'disagree',{});e.preventDefault();}
});

function start(data){
  if(data&&data.S&&data.S.phase&&data.S.setup&&data.S.setup.level){S=data.S;}else{S=freshSetup(null);}
  rebuild(S.custom);
  render();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){hot.snapshot(function(){return {S:S};});}
if(hot&&hot.ready){hot.ready(start);}else{start((hot&&hot.data)||{});}
})();
</script>
</body>
</html>
